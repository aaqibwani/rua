name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rua_test
          POSTGRES_USER: rua
          POSTGRES_PASSWORD: rua
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rua"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://rua:rua@localhost:5432/rua_test
      # CI-only value. Never reuse it anywhere real.
      SECRET_KEY: ci-secret-key-not-for-any-deployment-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e .

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: No model change is missing a migration
        run: |
          alembic check

      # Milestone 2's acceptance criterion, asserted against a real database
      # rather than only in unit tests: exactly 60 domains, and a second run is
      # a no-op.
      - name: Seed is deterministic and idempotent
        run: |
          rua seed --demo
          rua seed --demo
          python - <<'PY'
          from sqlalchemy import func, select
          from rua.db import session_scope
          from rua.models import Domain, Role

          with session_scope() as s:
              total = s.scalar(select(func.count()).select_from(Domain))
              tenant = s.scalar(select(Domain).where(Domain.role == Role.TENANT))
              mismatches = s.scalar(
                  select(func.count()).select_from(Domain).where(Domain.rua_matches.is_(False))
              )

          assert total == 60, f"expected 60 domains after two seed runs, got {total}"
          assert tenant is not None and tenant.name.endswith(".onmicrosoft.com")
          assert {tenant.dmarc, tenant.spf, tenant.dkim, tenant.mtasts, tenant.tlsrpt} == {"na"}, (
              "the tenant row must have every posture field na"
          )
          assert mismatches == 3, f"expected 3 rua= mismatches, got {mismatches}"
          print(f"OK: {total} domains, tenant row all-na, {mismatches} rua= mismatches")
          PY

      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rua:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile CMD is `rua serve`, which only exists if the package itself
      # was installed — not just its requirements. Assert it directly, because the
      # failure mode is a container that starts and immediately exits.
      - name: Console script is installed
        run: |
          docker run --rm rua:ci rua --version
          docker run --rm rua:ci rua serve --help

      - name: Runs as a non-root user
        run: |
          test "$(docker run --rm rua:ci id -u)" = "10001"

  publish:
    needs: [lint, test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/rua', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
